# ====================================
# Alertmanager 告警分发配置
# ====================================
global:
  # SMTP 邮件发送配置(从环境变量覆盖)
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_USER}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: false
  resolve_timeout: 5m

# 告警模板(可选)
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# 分组路由
route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s            # 首次告警等待时间,聚合同组告警
  group_interval: 5m         # 同组告警发送间隔
  repeat_interval: 4h        # 重复告警间隔
  receiver: "default"        # 默认接收方

  # 子路由: 按 severity 分流
  routes:
    # 严重告警 - 立即邮件+webhook
    - match:
        severity: critical
      receiver: "critical-notifications"
      group_wait: 10s
      repeat_interval: 1h

    # 警告级别 - 邮件
    - match:
        severity: warning
      receiver: "warning-notifications"

# 接收方定义
receivers:
  # 默认接收方(站内消息 - 通过 webhook 写入)
  - name: "default"
    webhook_configs:
      - url: "http://backend:8000/api/notifications/webhook"
        send_resolved: true

  # 严重告警接收方(邮件 + Webhook)
  - name: "critical-notifications"
    email_configs:
      - to: "${ALERT_EMAIL_TO:-admin@example.com}"
        subject: "[严重] {{ .CommonLabels.alertname }}"
        body: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
    webhook_configs:
      - url: "http://backend:8000/api/notifications/webhook"
        send_resolved: true

  # 警告级别接收方(仅邮件)
  - name: "warning-notifications"
    email_configs:
      - to: "${ALERT_EMAIL_TO:-admin@example.com}"
        subject: "[警告] {{ .CommonLabels.alertname }}"
        body: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

# 告警抑制规则
inhibit_rules:
  # 当服务离线时,抑制该服务下的其他告警
  - source_match:
      alertname: "BackendDown"
    target_match_re:
      service: "backend"
    equal: ["service"]

  - source_match:
      alertname: "PostgreSQLDown"
    target_match_re:
      service: "database"
    equal: ["service"]
