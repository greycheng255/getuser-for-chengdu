# ====================================
# Prometheus 监控配置
# ====================================
global:
  scrape_interval: 15s          # 默认抓取间隔
  evaluation_interval: 15s      # 规则评估间隔
  external_labels:
    monitor: "mediacrawler-monitor"

# 告警规则文件
rule_files:
  - "/etc/prometheus/rules/*.yml"

# 告警发送到 Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# 抓取目标
scrape_configs:
  # ============== Prometheus 自身 ==============
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ============== 主机指标 ==============
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host"

  # ============== 后端 API 应用指标 ==============
  # 需后端集成 prometheus_client 暴露 /metrics
  - job_name: "backend-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          app: "mediacrawler-api"
    # 后端可能未集成指标端点,抓取失败不影响其他
    scrape_timeout: 10s

  # ============== PostgreSQL 指标 ==============
  # 需额外部署 postgres_exporter(本配置预留,生产环境按需启用)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "database"
    scrape_timeout: 10s

  # ============== Redis 指标 ==============
  # 需额外部署 redis_exporter(本配置预留)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "cache"
    scrape_timeout: 10s
