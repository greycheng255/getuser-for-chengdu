# ====================================
# MediaCrawler 获客系统 - 完整编排
# 包含: 后端 API + 前端 WebUI + PostgreSQL + Redis + Prometheus + Grafana
# ====================================
version: "3.8"

services:
  # ============== 数据库 ==============
  postgres:
    image: postgres:15-alpine
    container_name: mediacrawler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediacrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediacrawler123}
      POSTGRES_DB: ${POSTGRES_DB:-mediacrawler}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediacrawler}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediacrawler-net

  # ============== 缓存 ==============
  redis:
    image: redis:7-alpine
    container_name: mediacrawler-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediacrawler-net

  # ============== 后端 API ==============
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediacrawler-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库配置
      SAVE_DATA_OPTION: postgres
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-mediacrawler}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-mediacrawler123}
      PG_DB: ${POSTGRES_DB:-mediacrawler}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 邮件通知(可选)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # 时区
      TZ: Asia/Shanghai
      # 虚拟显示
      DISPLAY: :99
    volumes:
      - ./data:/app/data
      - ./logs:/tmp
    ports:
      - "8000:8000"
    networks:
      - mediacrawler-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============== 前端 WebUI ==============
  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    container_name: mediacrawler-webui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - mediacrawler-net

  # ============== 监控: Prometheus ==============
  prometheus:
    image: prom/prometheus:latest
    container_name: mediacrawler-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - mediacrawler-net

  # ============== 监控: Grafana ==============
  grafana:
    image: grafana/grafana:latest
    container_name: mediacrawler-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - mediacrawler-net

  # ============== 告警: Alertmanager ==============
  alertmanager:
    image: prom/alertmanager:latest
    container_name: mediacrawler-alertmanager
    restart: unless-stopped
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    networks:
      - mediacrawler-net

  # ============== 指标采集: Node Exporter ==============
  node-exporter:
    image: prom/node-exporter:latest
    container_name: mediacrawler-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - mediacrawler-net

networks:
  mediacrawler-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
