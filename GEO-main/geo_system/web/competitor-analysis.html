<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞品分析 - GEO系统</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        
        .container { display: flex; min-height: 100vh; }
        
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h1 { font-size: 1.25rem; margin-bottom: 4px; }
        .sidebar-header p { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
        
        .nav-menu { list-style: none; padding: 16px 0; }
        .nav-item { padding: 14px 24px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); border-left-color: #667eea; }
        .nav-item .nav-icon { font-size: 1.25rem; }
        
        /* 主内容区 */
        .main-content { flex: 1; margin-left: 260px; padding: 32px; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-size: 1.75rem; font-weight: 700; color: #1a1a2e; }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        
        .btn-secondary {
            background: #fff; color: #667eea; padding: 12px 24px; border: 1px solid #667eea;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
        }
        .btn-secondary:hover { background: #f8f9ff; }
        
        /* 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .stat-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .stat-value { font-size: 2.25rem; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .stat-label { color: #6b7280; font-size: 0.9rem; }
        
        /* 标签页 */
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: white; padding: 8px; border-radius: 12px; }
        .tab { padding: 12px 24px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: #6b7280; transition: all 0.2s; }
        .tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .tab:hover:not(.active) { background: #f3f4f6; }
        
        /* 面板 */
        .panel { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: none; }
        .panel.active { display: block; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
        .panel-title { font-size: 1.1rem; font-weight: 600; }
        
        /* 竞品列表 */
        .competitor-list { display: flex; flex-direction: column; gap: 16px; }
        .competitor-item { display: flex; align-items: center; padding: 20px; background: #f9fafb; border-radius: 12px; transition: all 0.2s; border: 2px solid transparent; }
        .competitor-item:hover { background: #f3f4f6; border-color: #667eea; }
        .competitor-item.selected { border-color: #667eea; background: #f0f4ff; }
        .competitor-avatar { width: 56px; height: 56px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; margin-right: 16px; }
        .competitor-info { flex: 1; }
        .competitor-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .competitor-meta { font-size: 0.85rem; color: #6b7280; display: flex; gap: 16px; }
        .competitor-actions { display: flex; gap: 8px; }
        .btn-small { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-small.primary { background: #667eea; color: white; }
        .btn-small.primary:hover { background: #5a6fd6; }
        .btn-small.danger { background: #fee2e2; color: #dc2626; }
        .btn-small.danger:hover { background: #fecaca; }
        
        /* 表单 */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; color: #374151; }
        .form-input { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        textarea.form-input { min-height: 100px; resize: vertical; }
        
        /* 对比图表 */
        .comparison-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .comparison-card { background: #f9fafb; border-radius: 12px; padding: 20px; }
        .comparison-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .comparison-title { font-weight: 600; }
        .comparison-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
        .comparison-badge.win { background: #d1fae5; color: #059669; }
        .comparison-badge.lose { background: #fee2e2; color: #dc2626; }
        .comparison-badge.tie { background: #fef3c7; color: #d97706; }
        
        /* SWOT */
        .swot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 24px; }
        .swot-item { padding: 16px; border-radius: 8px; }
        .swot-item.strengths { background: #d1fae5; border-left: 4px solid #059669; }
        .swot-item.weaknesses { background: #fee2e2; border-left: 4px solid #dc2626; }
        .swot-item.opportunities { background: #dbeafe; border-left: 4px solid #2563eb; }
        .swot-item.threats { background: #fef3c7; border-left: 4px solid #d97706; }
        .swot-title { font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .swot-list { font-size: 0.85rem; color: #374151; }
        .swot-list li { margin-bottom: 4px; padding-left: 16px; position: relative; }
        .swot-list li::before { content: '•'; position: absolute; left: 0; }
        
        /* 雷达图容器 */
        .radar-container { max-width: 400px; margin: 0 auto; }
        
        /* 模态框 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 32px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-title { font-size: 1.25rem; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; border: none; background: #f3f4f6; border-radius: 8px; cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #e5e7eb; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 60px 20px; color: #6b7280; }
        .empty-state-icon { font-size: 4rem; margin-bottom: 16px; }
        .empty-state-text { font-size: 1.1rem; margin-bottom: 24px; }
        
        /* 加载动画 */
        .loading { display: none; text-align: center; padding: 40px; }
        .loading.active { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #f3f4f6; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 通知提示 */
        .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; color: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 2000; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🚀 GEO系统</h1>
                <p>AI搜索时代的内容优化</p>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item" onclick="window.location.href='index.html'">
                        <span class="nav-icon">🏠</span><span>首页</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='projects.html'">
                        <span class="nav-icon">📁</span><span>我的项目</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='ai-tasks.html'">
                        <span class="nav-icon">🤖</span><span>AI任务</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='content-calendar.html'">
                        <span class="nav-icon">📅</span><span>内容日历</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='content-generator.html'">
                        <span class="nav-icon">✍️</span><span>内容生成</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='content-analyzer.html'">
                        <span class="nav-icon">🔍</span><span>内容分析</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='analytics-dashboard.html'">
                        <span class="nav-icon">📈</span><span>数据报表</span>
                    </li>
                    <li class="nav-item active" onclick="window.location.href='competitor-analysis.html'">
                        <span class="nav-icon">🎯</span><span>竞品分析</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='keyword-research.html'">
                        <span class="nav-icon">🔑</span><span>关键词研究</span>

                    <li class="nav-item" onclick="window.location.href='sentiment-monitor.html'">
                        <span class="nav-icon">💬</span><span>舆情监控</span>

                    <li class="nav-item" onclick="window.location.href='brand-diagnosis.html'">
                        <span class="nav-icon">🏥</span><span>品牌诊断</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='publish-manager.html'">
                        <span class="nav-icon">📤</span><span>发布管理</span>
                    </li>
                    <li class="nav-item" onclick="window.location.href='monitoring-dashboard.html'">
                        <span class="nav-icon">📊</span><span>效果监控</span>
                    </li>
                </ul>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">🎯 竞品分析</h1>
                <button class="btn-primary" onclick="openAddModal()">
                    <span>+</span> 添加竞品
                </button>
            </div>
            
            <!-- 统计卡片 -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon">🏢</div>
                    <div class="stat-value" id="totalCompetitors">0</div>
                    <div class="stat-label">监控竞品数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-value" id="totalComparisons">0</div>
                    <div class="stat-label">对比报告数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value" id="activeCount">0</div>
                    <div class="stat-label">活跃监控</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-value" id="avgScore">--</div>
                    <div class="stat-label">平均综合得分</div>
                </div>
            </div>
            
            <!-- 标签页 -->
            <div class="tabs">
                <button class="tab active" data-tab="list">竞品列表</button>
                <button class="tab" data-tab="analyze">分析竞品</button>
                <button class="tab" data-tab="compare">竞品对比</button>
            </div>
            
            <!-- 竞品列表面板 -->
            <div class="panel active" id="listPanel">
                <div class="panel-header">
                    <h2 class="panel-title">竞品列表</h2>
                    <div style="display: flex; gap: 8px;">
                        <select id="filterStatus" class="form-input" style="width: auto;" onchange="loadCompetitors()">
                            <option value="">全部状态</option>
                            <option value="active">活跃监控</option>
                            <option value="paused">暂停监控</option>
                            <option value="removed">已移除</option>
                        </select>
                    </div>
                </div>
                <div class="competitor-list" id="competitorList">
                    <!-- 动态加载 -->
                </div>
                <div class="loading" id="listLoading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-state-icon">🏢</div>
                    <div class="empty-state-text">暂无竞品数据</div>
                    <button class="btn-primary" onclick="openAddModal()">添加第一个竞品</button>
                </div>
            </div>
            
            <!-- 分析面板 -->
            <div class="panel" id="analyzePanel">
                <div class="panel-header">
                    <h2 class="panel-title">竞品分析</h2>
                </div>
                <div id="analyzeContent">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-text">选择一个竞品开始分析</div>
                        <button class="btn-secondary" onclick="switchTab('list')">前往竞品列表</button>
                    </div>
                </div>
            </div>
            
            <!-- 对比面板 -->
            <div class="panel" id="comparePanel">
                <div class="panel-header">
                    <h2 class="panel-title">竞品对比</h2>
                </div>
                <div id="compareContent">
                    <div style="max-width: 600px; margin: 0 auto;">
                        <div class="form-group">
                            <label class="form-label">我的品牌名称</label>
                            <input type="text" id="myBrand" class="form-input" placeholder="输入您的品牌名称" value="织然家具">
                        </div>
                        <div class="form-group">
                            <label class="form-label">选择竞品</label>
                            <select id="compareCompetitor" class="form-input">
                                <option value="">-- 请选择竞品 --</option>
                            </select>
                        </div>
                        <button class="btn-primary" style="width: 100%;" onclick="runComparison()">
                            开始对比分析
                        </button>
                    </div>
                </div>

                    <div class="spinner"></div>
                    <div>分析中...</div>
                </div>

    <!-- 添加竞品模态框 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">添加竞品</h2>
                <button class="modal-close" onclick="closeAddModal()">×</button>
            </div>
            <form id="addCompetitorForm" onsubmit="addCompetitor(event)">
                <div class="form-group">
                    <label class="form-label">品牌名称 *</label>
                    <input type="text" name="brand_name" class="form-input" placeholder="如：欧派家居" required>
                </div>
                <div class="form-group">
                    <label class="form-label">官网网址</label>
                    <input type="url" name="website" class="form-input" placeholder="https://www.example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">所属行业</label>
                    <input type="text" name="industry" class="form-input" placeholder="如：定制家具">
                </div>
                <div class="form-group">
                    <label class="form-label">品牌描述</label>
                    <textarea name="description" class="form-input" placeholder="简要描述该品牌..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">核心关键词（用逗号分隔）</label>
                    <input type="text" name="keywords" class="form-input" placeholder="定制家具,全屋定制,衣柜">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeAddModal()">取消</button>
                    <button type="submit" class="btn-primary">添加竞品</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Toast通知 -->
    <div class="toast" id="toast"></div>
    
    <script>
        const API_BASE = 'http://localhost:5000/api';
        let competitors = [];
        let selectedCompetitorId = null;
        let comparisonChart = null;
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            initTabs();
            loadCompetitors();
            loadStats();
        });
        
        // 初始化标签页
        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabName = this.dataset.tab;
                    switchTab(tabName);
                });
            });
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(`${tabName}Panel`).classList.add('active');
        }
        
        // 加载竞品列表
        async function loadCompetitors() {
            const listLoading = document.getElementById('listLoading');
            const listEl = document.getElementById('competitorList');
            const emptyEl = document.getElementById('emptyState');
            
            listLoading.classList.add('active');
            listEl.style.display = 'none';
            emptyEl.style.display = 'none';
            
            try {
                const status = document.getElementById('filterStatus').value;
                const url = status ? `${API_BASE}/competitors?status=${status}` : `${API_BASE}/competitors`;
                const resp = await fetch(url);
                const data = await resp.json();
                
                if (data.success) {
                    competitors = data.competitors || [];
                    renderCompetitorList();
                    
                    // 更新对比下拉框
                    updateCompareSelect();
                }
            } catch (err) {
                console.error('加载竞品失败:', err);
                showToast('加载竞品失败', 'error');
            } finally {
                listLoading.classList.remove('active');
                if (competitors.length === 0) {
                    emptyEl.style.display = 'block';
                } else {
                    listEl.style.display = 'flex';
                }
            }
        }
        
        // 渲染竞品列表
        function renderCompetitorList() {
            const listEl = document.getElementById('competitorList');
            
            if (competitors.length === 0) {
                listEl.innerHTML = '';
                return;
            }
            
            listEl.innerHTML = competitors.map(c => `
                <div class="competitor-item" data-id="${c.id}">
                    <div class="competitor-avatar">${c.brand_name.charAt(0)}</div>
                    <div class="competitor-info">
                        <div class="competitor-name">${c.brand_name}</div>
                        <div class="competitor-meta">
                            <span>🌐 ${c.website || '未填写'}</span>
                            <span>🏷️ ${c.industry || '未分类'}</span>
                            <span>📅 ${c.last_analyzed_at ? new Date(c.last_analyzed_at).toLocaleDateString() : '未分析'}</span>
                        </div>
                    </div>
                    <div class="competitor-actions">
                        <button class="btn-small primary" onclick="analyzeCompetitor('${c.id}')">分析</button>
                        <button class="btn-small" onclick="selectForCompare('${c.id}')">对比</button>
                        <button class="btn-small danger" onclick="deleteCompetitor('${c.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 加载统计数据
        async function loadStats() {
            try {
                const resp = await fetch(`${API_BASE}/competitors`);
                const data = await resp.json();
                
                if (data.success) {
                    const list = data.competitors || [];
                    document.getElementById('totalCompetitors').textContent = list.length;
                    document.getElementById('activeCount').textContent = list.filter(c => c.status === 'active').length;
                }
            } catch (err) {
                console.error('加载统计失败:', err);
            }
        }
        
        // 打开添加模态框
        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addCompetitorForm').reset();
        }
        
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }
        
        // 添加竞品
        async function addCompetitor(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            const keywordsStr = formData.get('keywords');
            const keywords = keywordsStr ? keywordsStr.split(',').map(k => k.trim()).filter(k => k) : [];
            
            const data = {
                brand_name: formData.get('brand_name'),
                website: formData.get('website') || '',
                industry: formData.get('industry') || '',
                description: formData.get('description') || '',
                keywords: keywords
            };
            
            try {
                const resp = await fetch(`${API_BASE}/competitors`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                
                if (result.success) {
                    showToast('竞品添加成功', 'success');
                    closeAddModal();
                    loadCompetitors();
                    loadStats();
                } else {
                    showToast(result.error || '添加失败', 'error');
                }
            } catch (err) {
                console.error('添加竞品失败:', err);
                showToast('添加竞品失败', 'error');
            }
        }
        
        // 分析竞品
        async function analyzeCompetitor(id) {
            switchTab('analyze');
            
            const contentEl = document.getElementById('analyzeContent');
            contentEl.innerHTML = `
                <div class="loading active">
                    <div class="spinner"></div>
                    <div>正在分析竞品...</div>
                </div>
            `;
            
            try {
                const resp = await fetch(`${API_BASE}/competitors/${id}/analyze`, {
                    method: 'POST'
                });
                const data = await resp.json();
                
                if (data.success) {
                    renderAnalysisResult(data.result);
                } else {
                    contentEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">${data.error || '分析失败'}</div></div>`;
                }
            } catch (err) {
                console.error('分析竞品失败:', err);
                contentEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">分析失败，请稍后重试</div></div>`;
            }
        }
        
        // 渲染分析结果
        function renderAnalysisResult(result) {
            const contentEl = document.getElementById('analyzeContent');
            const competitor = competitors.find(c => c.id === result.competitor_id);
            const metrics = result.metrics || [];
            
            contentEl.innerHTML = `
                <div style="margin-bottom: 24px;">
                    <h3 style="font-size: 1.2rem; margin-bottom: 16px;">🎯 ${competitor?.brand_name || '竞品'} - 分析报告</h3>
                    <p style="color: #6b7280;">分析时间: ${new Date(result.analyzed_at).toLocaleString()}</p>
                </div>
                
                <div class="comparison-grid">
                    ${metrics.map(m => `
                        <div class="comparison-card">
                            <div class="comparison-header">
                                <span class="comparison-title">${getDimensionName(m.dimension)}</span>
                                <span class="comparison-badge ${m.score >= 70 ? 'win' : m.score >= 50 ? 'tie' : 'lose'}">
                                    ${m.score}分
                                </span>
                            </div>
                            <div style="font-size: 0.9rem; color: #6b7280; margin-bottom: 12px;">
                                ${m.value}
                            </div>
                            <div style="font-size: 0.85rem;">
                                <strong>详情：</strong>
                                <ul style="margin-top: 8px; padding-left: 16px;">
                                    ${Object.entries(m.details || {}).map(([k, v]) => `<li>${k}: ${v}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <div style="margin-top: 24px; text-align: center;">
                    <button class="btn-primary" onclick="selectForCompare('${result.competitor_id}')">
                        📊 与该竞品对比
                    </button>
                </div>
            `;
        }
        
        function getDimensionName(dimension) {
            const names = {
                'ai_visibility': '🤖 AI可见度',
                'search_rank': '🔍 搜索排名',
                'content_volume': '📝 内容产量',
                'social_engagement': '💬 社交互动',
                'brand_mention': '🏷️ 品牌提及',
                'sentiment': '😊 舆情情感'
            };
            return names[dimension] || dimension;
        }
        
        // 更新对比选择下拉框
        function updateCompareSelect() {
            const select = document.getElementById('compareCompetitor');
            select.innerHTML = '<option value="">-- 请选择竞品 --</option>' +
                competitors.map(c => `<option value="${c.id}">${c.brand_name}</option>`).join('');
        }
        
        // 选择竞品进行对比
        function selectForCompare(id) {
            document.getElementById('compareCompetitor').value = id;
            switchTab('compare');
            if (document.getElementById('myBrand').value) {
                runComparison();
            }
        }
        
        // 运行对比分析
        async function runComparison() {
            const myBrand = document.getElementById('myBrand').value.trim();
            const competitorId = document.getElementById('compareCompetitor').value;
            
            if (!myBrand) {
                showToast('请输入您的品牌名称', 'error');
                return;
            }
            if (!competitorId) {
                showToast('请选择要对比的竞品', 'error');
                return;
            }
            
            const loadingEl = document.getElementById('compareLoading');
            const contentEl = document.getElementById('compareContent');
            
            contentEl.style.display = 'none';
            loadingEl.classList.add('active');
            
            try {
                const resp = await fetch(`${API_BASE}/competitors/compare`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ my_brand: myBrand, competitor_id: competitorId })
                });
                const data = await resp.json();
                
                if (data.success) {
                    renderComparisonResult(data.report);
                } else {
                    contentEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">${data.error || '对比失败'}</div></div>`;
                }
            } catch (err) {
                console.error('对比分析失败:', err);
                contentEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">对比分析失败，请稍后重试</div></div>`;
            } finally {
                loadingEl.classList.remove('active');
                contentEl.style.display = 'block';
            }
        }
        
        // 渲染对比结果
        function renderComparisonResult(report) {
            const contentEl = document.getElementById('compareContent');
            const comp = competitors.find(c => c.id === report.competitor_id);
            const results = report.comparison_results || [];
            const swot = report.swot || {};
            
            contentEl.innerHTML = `
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 1.5rem; margin-bottom: 8px;">${report.my_brand} vs ${comp?.brand_name}</h2>
                    <div style="display: flex; justify-content: center; gap: 40px; margin-top: 16px;">
                        <div>
                            <div style="font-size: 2rem; font-weight: 700; color: #667eea;">${report.my_overall_score}</div>
                            <div style="color: #6b7280;">我方得分</div>
                        </div>
                        <div style="font-size: 2rem; color: #d1d5db;">VS</div>
                        <div>
                            <div style="font-size: 2rem; font-weight: 700; color: #764ba2;">${report.competitor_overall_score}</div>
                            <div style="color: #6b7280;">竞品得分</div>
                        </div>
                    </div>
                    <div style="margin-top: 12px; font-size: 1.1rem;">
                        差距: <strong style="color: ${report.overall_gap >= 0 ? '#10b981' : '#ef4444'}">${report.overall_gap >= 0 ? '+' : ''}${report.overall_gap}</strong>
                    </div>
                </div>
                
                <!-- 雷达图 -->
                <div class="radar-container" style="margin-bottom: 32px;">
                    <canvas id="comparisonRadar"></canvas>
                </div>
                
                <!-- 各维度对比 -->
                <div class="comparison-grid">
                    ${results.map(r => `
                        <div class="comparison-card">
                            <div class="comparison-header">
                                <span class="comparison-title">${getDimensionName(r.dimension)}</span>
                                <span class="comparison-badge ${r.winner === 'me' ? 'win' : r.winner === 'competitor' ? 'lose' : 'tie'}">
                                    ${r.winner === 'me' ? '我方领先' : r.winner === 'competitor' ? '竞品领先' : '平手'}
                                </span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                                <div>
                                    <div style="font-size: 1.5rem; font-weight: 700; color: #667eea;">${r.my_score}</div>
                                    <div style="font-size: 0.8rem; color: #6b7280;">${report.my_brand}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 1.5rem; font-weight: 700; color: #764ba2;">${r.competitor_score}</div>
                                    <div style="font-size: 0.8rem; color: #6b7280;">${comp?.brand_name}</div>
                                </div>
                            </div>
                            <div style="font-size: 0.85rem; color: #6b7280; padding: 8px; background: #f9fafb; border-radius: 6px;">
                                ${r.gap_analysis}
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <!-- SWOT分析 -->
                <div class="swot-grid" style="margin-top: 32px;">
                    <div class="swot-item strengths">
                        <div class="swot-title">💪 优势 (Strengths)</div>
                        <ul class="swot-list">${(swot.strengths || []).map(s => `<li>${s}</li>`).join('')}</ul>
                    </div>
                    <div class="swot-item weaknesses">
                        <div class="swot-title">⚠️ 劣势 (Weaknesses)</div>
                        <ul class="swot-list">${(swot.weaknesses || []).map(w => `<li>${w}</li>`).join('')}</ul>
                    </div>
                    <div class="swot-item opportunities">
                        <div class="swot-title">🚀 机会 (Opportunities)</div>
                        <ul class="swot-list">${(swot.opportunities || []).map(o => `<li>${o}</li>`).join('')}</ul>
                    </div>
                    <div class="swot-item threats">
                        <div class="swot-title">⚡ 威胁 (Threats)</div>
                        <ul class="swot-list">${(swot.threats || []).map(t => `<li>${t}</li>`).join('')}</ul>
                    </div>
                </div>
            `;
            
            // 渲染雷达图
            setTimeout(() => {
                const ctx = document.getElementById('comparisonRadar');
                if (ctx && comparisonChart) {
                    comparisonChart.destroy();
                }
                
                comparisonChart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: results.map(r => getDimensionName(r.dimension).split(' ')[1]),
                        datasets: [
                            {
                                label: report.my_brand,
                                data: results.map(r => r.my_score),
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.2)',
                                borderWidth: 2
                            },
                            {
                                label: comp?.brand_name,
                                data: results.map(r => r.competitor_score),
                                borderColor: '#764ba2',
                                backgroundColor: 'rgba(118, 75, 162, 0.2)',
                                borderWidth: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            r: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                });
            }, 100);
        }
        
        // 删除竞品
        async function deleteCompetitor(id) {
            if (!confirm('确定要删除这个竞品吗？')) return;
            
            try {
                const resp = await fetch(`${API_BASE}/competitors/${id}`, {
                    method: 'DELETE'
                });
                const data = await resp.json();
                
                if (data.success) {
                    showToast('竞品已删除', 'success');
                    loadCompetitors();
                    loadStats();
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (err) {
                console.error('删除竞品失败:', err);
                showToast('删除失败', 'error');
            }
        }
        
        // Toast通知
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
