<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - GEO系统</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #64748b;
            font-size: 0.9375rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.9375rem;
        }

        .form-group input {
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .auth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.4);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🚀 GEO系统</h1>
                <p>创建账号，开启AI内容优化之旅</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <span class="password-hint">密码长度至少6位</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">
                    注册
                </button>
            </form>

            <div class="auth-footer">
                <p>已有账号？<a href="login.html">立即登录</a></p>
            </div>
        </div>
    </div>

    <script>
        // 自动检测：如果页面通过localhost访问则用localhost:5000，否则用当前host
        const API_BASE_URL = (typeof API_HOST !== 'undefined' && API_HOST) ? API_HOST :
            (window.location.protocol + '//' + window.location.hostname + ':5001') + '/api';

        // 表单验证规则
        const validators = {
            username: (value) => {
                if (!value) return '用户名不能为空';
                if (value.length < 3) return '用户名至少3个字符';
                if (value.length > 50) return '用户名最多50个字符';
                if (!/^[a-zA-Z0-9_@.]+$/.test(value)) return '用户名只能包含字母、数字、下划线和@.';
                return null;
            },
            password: (value) => {
                if (!value) return '密码不能为空';
                if (value.length < 6) return '密码至少6个字符';
                if (value.length > 100) return '密码最多100个字符';
                return null;
            },
            confirmPassword: (value, password) => {
                if (!value) return '请确认密码';
                if (value !== password) return '两次输入的密码不一致';
                return null;
            }
        };

        // 实时验证
        document.getElementById('username').addEventListener('blur', function() {
            const error = validators.username(this.value.trim());
            if (error) showFieldError(this, error);
            else clearFieldError(this);
        });

        document.getElementById('password').addEventListener('blur', function() {
            const error = validators.password(this.value);
            if (error) showFieldError(this, error);
            else clearFieldError(this);
        });

        document.getElementById('confirmPassword').addEventListener('blur', function() {
            const password = document.getElementById('password').value;
            const error = validators.confirmPassword(this.value, password);
            if (error) showFieldError(this, error);
            else clearFieldError(this);
        });

        function showFieldError(input, message) {
            input.style.borderColor = '#ef4444';
            // 检查是否已有错误提示
            let errorDiv = input.parentElement.querySelector('.field-error');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.className = 'field-error';
                errorDiv.style.cssText = 'color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem;';
                input.parentElement.appendChild(errorDiv);
            }
            errorDiv.textContent = message;
        }

        function clearFieldError(input) {
            input.style.borderColor = '#e2e8f0';
            const errorDiv = input.parentElement.querySelector('.field-error');
            if (errorDiv) errorDiv.remove();
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // 清除之前的错误
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // 验证所有字段
            const usernameError = validators.username(username);
            const passwordError = validators.password(password);
            const confirmError = validators.confirmPassword(confirmPassword, password);

            if (usernameError) {
                showError(usernameError);
                document.getElementById('username').focus();
                return;
            }
            if (passwordError) {
                showError(passwordError);
                document.getElementById('password').focus();
                return;
            }
            if (confirmError) {
                showError(confirmError);
                document.getElementById('confirmPassword').focus();
                return;
            }

            // 显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span>注册中...';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时

                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                let data;
                try {
                    data = await response.json();
                } catch (parseError) {
                    throw new Error('服务器响应格式错误');
                }

                if (response.ok && data.success) {
                    showSuccess('🎉 注册成功！即将跳转到登录页面...');
                    // 保存用户名到localStorage，方便登录页自动填充
                    localStorage.setItem('last_username', username);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    const errorMsg = data.message || `注册失败 (${response.status})`;
                    showError(errorMsg);
                }
            } catch (error) {
                console.error('Register error:', error);
                if (error.name === 'AbortError') {
                    showError('请求超时，请检查网络连接');
                } else if (error.message.includes('Failed to fetch')) {
                    showError('无法连接到服务器，请稍后重试');
                } else {
                    showError(error.message || '网络错误，请稍后重试');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '注册';
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(message) {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        // 如果已登录，直接跳转
        if (localStorage.getItem('access_token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
