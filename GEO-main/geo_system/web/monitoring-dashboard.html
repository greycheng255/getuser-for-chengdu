<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>效果监控仪表板 - GEO系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.95rem;
        }

        .stat-change {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .stat-change.positive {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .stat-change.negative {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* 图表区域 */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .chart-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-small:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .chart-content {
            min-height: 200px;
        }

        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table th {
            color: #a0a0a0;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .rank-badge.top3 {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #000;
        }

        .rank-badge.normal {
            background: rgba(255, 255, 255, 0.1);
        }

        .trend-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
        }

        .trend-indicator.up {
            color: #10b981;
        }

        .trend-indicator.down {
            color: #ef4444;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* 平台标签 */
        .platform-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .time-selector {
            display: flex;
            gap: 8px;
        }

        .time-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #a0a0a0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .time-btn:hover,
        .time-btn.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
            color: #fff;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📊 效果监控仪表板</h1>
            <p>实时监控搜索排名、AI引用和品牌曝光效果</p>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="time-selector">
                <button class="time-btn active" data-days="7">近7天</button>
                <button class="time-btn" data-days="30">近30天</button>
                <button class="time-btn" data-days="90">近90天</button>
            </div>
            <button class="btn-small" onclick="refreshData()">🔄 刷新数据</button>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsGrid">
            <!-- 动态加载 -->
        </div>

        <!-- 图表区域 -->
        <div class="charts-section">
            <!-- AI引用统计 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">🤖 AI引用分析</h3>
                    <button class="btn-small" onclick="checkAICitation()">单次检测</button>
                </div>
                <div class="chart-content" id="aiCitationChart">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- 流量来源 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">🌐 流量来源分析</h3>
                </div>
                <div class="chart-content" id="trafficChart">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>

        <!-- AI 引用批量检测面板 -->
        <div class="chart-card" style="margin-bottom: 40px;">
            <div class="chart-header">
                <h3 class="chart-title">⚡ AI 引用率批量检测</h3>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn-small" onclick="testAIApi()">🧪 测试API</button>
                    <button class="btn-small" onclick="runBatchCheck()">🚀 立即批量检测</button>
                    <button class="btn-small" onclick="loadCitationBatches()">📋 检测历史</button>
                </div>
            </div>

            <div style="padding: 16px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 16px;">
                <h4 style="color:#a0a0a0;font-size:0.9rem;margin-bottom:12px;">📋 检测关键词管理</h4>

                <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
                    <input type="text" id="newKeywordInput" placeholder="输入关键词（按回车添加）" style="flex:1;min-width:200px;padding:8px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;">
                    <input type="text" id="brandNameInput" placeholder="品牌名（默认：织然家具）" style="width:180px;padding:8px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;">
                    <button class="btn-small" onclick="addKeyword()">➕ 添加</button>
                    <button class="btn-small" onclick="loadKeywords()">🔄 加载</button>
                </div>

                <div style="margin-bottom:12px;">
                    <textarea id="batchKeywordsInput" placeholder="批量添加关键词（每行一个）" rows="3" style="width:100%;padding:8px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#fff;font-family:inherit;"></textarea>
                    <button class="btn-small" onclick="addBatchKeywords()" style="margin-top:6px;">📋 批量添加</button>
                </div>

                <div id="keywordsList" style="display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow-y:auto;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;">
                    <span style="color:#666;">点击「加载」查看已配置的关键词</span>
                </div>
            </div>

            <div style="padding: 16px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 16px;">
                <h4 style="color:#a0a0a0;font-size:0.9rem;margin-bottom:12px;">⚙️ 检测配置</h4>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <label style="color:#a0a0a0;font-size:0.9rem;">平台：</label>
                    <label style="display:flex;align-items:center;gap:4px;color:#fff;font-size:0.9rem;cursor:pointer;">
                        <input type="checkbox" class="platform-checkbox" value="chatgpt" checked> ChatGPT
                    </label>
                    <label style="display:flex;align-items:center;gap:4px;color:#fff;font-size:0.9rem;cursor:pointer;">
                        <input type="checkbox" class="platform-checkbox" value="deepseek"> DeepSeek
                    </label>
                    <label style="display:flex;align-items:center;gap:4px;color:#fff;font-size:0.9rem;cursor:pointer;">
                        <input type="checkbox" class="platform-checkbox" value="kimi"> Kimi
                    </label>
                    <label style="display:flex;align-items:center;gap:4px;color:#fff;font-size:0.9rem;cursor:pointer;">
                        <input type="checkbox" class="platform-checkbox" value="doubao"> 豆包
                    </label>
                </div>
            </div>

            <div id="batchCheckResult" style="padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; min-height: 60px;">
                <span style="color:#666;">点击「立即批量检测」开始检测</span>
            </div>

            <div id="schedulerStatus" style="margin-top:12px;padding:8px 12px;background:rgba(102,126,234,0.1);border-left:3px solid #667eea;border-radius:4px;font-size:0.85rem;color:#a0a0a0;">
                定时调度状态：加载中...
            </div>
        </div>

        <!-- 搜索排名 -->
        <div class="chart-card" style="margin-bottom: 40px;">
            <div class="chart-header">
                <h3 class="chart-title">🔍 关键词搜索排名</h3>
                <div class="chart-actions">
                    <input type="text" id="keywordInput" placeholder="输入关键词" style="padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff;">
                    <button class="btn-small" onclick="checkRank()">查询</button>
                </div>
            </div>
            <div class="chart-content" id="rankChart">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <script>
        // 动态获取API地址，支持环境变量配置
        // 自动检测：如果页面通过localhost访问则用localhost:5000，否则用当前host
        const API_BASE = (typeof API_HOST !== 'undefined' && API_HOST) ? API_HOST :
            (window.location.protocol + '//' + window.location.hostname + ':5001') + '/api';
        let currentDays = 7;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();

            // 时间选择器
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentDays = parseInt(this.dataset.days);
                    loadDashboard();
                });
            });
        });

        // 加载仪表板数据
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_BASE}/monitoring/dashboard?days=${currentDays}`);
                const data = await response.json();

                if (data.success) {
                    renderStats(data.dashboard);
                    renderAICitation(data.dashboard.ai_citation);
                    renderTraffic(data.dashboard.traffic);
                    renderSearchRank(data.dashboard.search_rank);
                }
            } catch (error) {
                console.error('加载仪表板失败:', error);
            }
        }

        // 渲染统计卡片
        function renderStats(dashboard) {
            const grid = document.getElementById('statsGrid');

            const aiStats = dashboard.ai_citation;
            const trafficStats = dashboard.traffic;

            grid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">🤖</div>
                    <div class="stat-value">${aiStats.mention_rate || 0}%</div>
                    <div class="stat-label">AI提及率</div>
                    <div class="stat-change ${aiStats.mention_rate > 50 ? 'positive' : 'negative'}">
                        ${aiStats.mention_rate > 50 ? '↑' : '↓'} ${aiStats.mentioned_count || 0}次提及
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-value">${(trafficStats.total_visitors || 0).toLocaleString()}</div>
                    <div class="stat-label">总访问量</div>
                    <div class="stat-change positive">
                        ↑ 来自${trafficStats.source_stats?.length || 0}个渠道
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-value">${trafficStats.conversion_rate || 0}%</div>
                    <div class="stat-label">转化率</div>
                    <div class="stat-change positive">
                        ${trafficStats.total_conversions || 0}次转化
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-value">${dashboard.search_rank?.length || 0}</div>
                    <div class="stat-label">监控关键词</div>
                    <div class="stat-change positive">
                        前10名占比 ${calculateTop10Rate(dashboard.search_rank)}%
                    </div>
                </div>
            `;
        }

        // 计算前10名占比
        function calculateTop10Rate(ranks) {
            if (!ranks || ranks.length === 0) return 0;
            const top10 = ranks.filter(r => r.latest_rank <= 10).length;
            return Math.round(top10 / ranks.length * 100);
        }

        // 渲染AI引用统计
        function renderAICitation(stats) {
            const container = document.getElementById('aiCitationChart');

            if (!stats || stats.total_queries === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🤖</div>
                        <p>暂无AI引用数据</p>
                    </div>
                `;
                return;
            }

            const platformStats = stats.platform_stats || {};
            const sentimentStats = stats.sentiment_stats || {};

            container.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>品牌提及率</span>
                        <span>${stats.mention_rate}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${stats.mention_rate}%"></div>
                    </div>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>AI平台</th>
                            <th>提及次数</th>
                            <th>占比</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.entries(platformStats).map(([platform, count]) => `
                            <tr>
                                <td><span class="platform-tag">${getPlatformIcon(platform)} ${getPlatformName(platform)}</span></td>
                                <td>${count}</td>
                                <td>${Math.round(count / stats.mentioned_count * 100)}%</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div style="margin-top: 16px; display: flex; gap: 16px;">
                    <span style="color: #10b981;">😊 正面: ${sentimentStats.positive || 0}</span>
                    <span style="color: #a0a0a0;">😐 中性: ${sentimentStats.neutral || 0}</span>
                    <span style="color: #ef4444;">😞 负面: ${sentimentStats.negative || 0}</span>
                </div>
            `;
        }

        // 渲染流量统计
        function renderTraffic(summary) {
            const container = document.getElementById('trafficChart');

            if (!summary || !summary.source_stats || summary.source_stats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🌐</div>
                        <p>暂无流量数据</p>
                    </div>
                `;
                return;
            }

            const maxVisitors = Math.max(...summary.source_stats.map(s => s.visitors));

            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>来源</th>
                            <th>访客数</th>
                            <th>占比</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${summary.source_stats.map(source => `
                            <tr>
                                <td>${getSourceName(source.source)}</td>
                                <td>${source.visitors.toLocaleString()}</td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <div class="progress-bar" style="flex: 1; max-width: 100px;">
                                            <div class="progress-fill" style="width: ${source.visitors / maxVisitors * 100}%"></div>
                                        </div>
                                        <span style="font-size: 0.85rem;">${Math.round(source.visitors / summary.total_visitors * 100)}%</span>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 渲染搜索排名
        function renderSearchRank(ranks) {
            const container = document.getElementById('rankChart');

            if (!ranks || ranks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>暂无排名数据，请点击查询按钮检查关键词排名</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>关键词</th>
                            <th>变化</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${ranks.map(rank => `
                            <tr>
                                <td>
                                    <span class="rank-badge ${rank.latest_rank <= 3 ? 'top3' : 'normal'}">
                                        ${rank.latest_rank}
                                    </span>
                                </td>
                                <td>${rank.keyword}</td>
                                <td>
                                    ${rank.change !== 0 ? `
                                        <span class="trend-indicator ${rank.change > 0 ? 'up' : 'down'}">
                                            ${rank.change > 0 ? '↑' : '↓'} ${Math.abs(rank.change)}
                                        </span>
                                    ` : '<span style="color: #a0a0a0;">-</span>'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 检查搜索排名
        async function checkRank() {
            const keyword = document.getElementById('keywordInput').value;
            if (!keyword) {
                alert('请输入关键词');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/monitoring/search-rank/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, search_engine: 'baidu' })
                });

                const data = await response.json();
                if (data.success) {
                    alert(`查询完成！找到 ${data.results.length} 条结果`);
                    loadDashboard();
                }
            } catch (error) {
                alert('查询失败');
            }
        }

        // 检查AI引用
        async function checkAICitation() {
            const query = prompt('请输入要测试的查询问题：', '定制家具哪个品牌好？');
            if (!query) return;

            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        platform: 'doubao',
                        query: query,
                        brand_name: '织然家具'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    const result = data.result;
                    alert(`检测结果：\n\n品牌提及: ${result.mentioned ? '✅ 是' : '❌ 否'}\n情感倾向: ${result.sentiment || 'neutral'}\n\n引用内容: ${result.content || '无'}`);
                    loadDashboard();
                }
            } catch (error) {
                alert('检测失败');
            }
        }

        // 刷新数据
        function refreshData() {
            loadDashboard();
            loadSchedulerStatus();
        }

        // ============ AI 引用率批量检测 ============

        // 测试AI API连通性
        async function testAIApi() {
            const resultDiv = document.getElementById('batchCheckResult');
            resultDiv.innerHTML = '<span style="color:#667eea;">⏳ 正在测试API连通性...</span>';
            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        platform: 'chatgpt',
                        query: '定制家具哪个品牌好？'
                    })
                });
                const data = await response.json();
                if (data.success) {
                    const r = data.result || {};
                    resultDiv.innerHTML = `
                        <div style="color:#10b981;font-weight:600;margin-bottom:8px;">✅ API连通正常</div>
                        <div style="color:#a0a0a0;font-size:0.85rem;">品牌提及: ${r.mentioned ? '✅' : '❌'} | 情感: ${r.sentiment || 'neutral'}</div>
                        <div style="margin-top:8px;color:#fff;font-size:0.9rem;max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.3);padding:8px;border-radius:4px;">${(r.content || r.response || '无内容').replace(/</g, '&lt;')}</div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color:#ef4444;">❌ ${data.error || data.message || '测试失败'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="color:#ef4444;">❌ 请求失败: ${error.message}</div>`;
            }
        }

        // 获取已选择的平台
        function getSelectedPlatforms() {
            return Array.from(document.querySelectorAll('.platform-checkbox:checked')).map(cb => cb.value);
        }

        // 执行批量检测
        async function runBatchCheck() {
            const platforms = getSelectedPlatforms();
            if (platforms.length === 0) {
                alert('请至少选择一个平台');
                return;
            }
            const brandName = document.getElementById('brandNameInput').value.trim() || '织然家具';
            const resultDiv = document.getElementById('batchCheckResult');
            resultDiv.innerHTML = '<span style="color:#667eea;">⏳ 正在执行批量检测，请耐心等待...</span>';

            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/batch-check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        platforms: platforms,
                        brand_name: brandName,
                        batch_name: `手动检测_${new Date().toLocaleString('zh-CN')}`
                    })
                });
                const data = await response.json();
                if (data.success) {
                    const r = data.result || data;
                    const totalQueries = r.total_queries || 0;
                    const mentioned = r.mentioned_count || 0;
                    const rate = totalQueries > 0 ? Math.round(mentioned / totalQueries * 100) : 0;
                    resultDiv.innerHTML = `
                        <div style="color:#10b981;font-weight:600;margin-bottom:8px;">✅ 批量检测完成</div>
                        <div style="display:flex;gap:16px;flex-wrap:wrap;color:#a0a0a0;font-size:0.9rem;">
                            <span>总查询: <b style="color:#fff;">${totalQueries}</b></span>
                            <span>提及次数: <b style="color:#10b981;">${mentioned}</b></span>
                            <span>引用率: <b style="color:#667eea;">${rate}%</b></span>
                        </div>
                        ${r.details && r.details.length ? `
                            <details style="margin-top:8px;">
                                <summary style="cursor:pointer;color:#a0a0a0;font-size:0.85rem;">查看详细结果 (${r.details.length}条)</summary>
                                <div style="margin-top:8px;max-height:300px;overflow-y:auto;">
                                    ${r.details.map(d => `
                                        <div style="padding:6px 8px;margin-bottom:4px;background:rgba(255,255,255,0.05);border-radius:4px;font-size:0.85rem;">
                                            <span style="color:${d.mentioned ? '#10b981' : '#a0a0a0'};">${d.mentioned ? '✅' : '❌'}</span>
                                            <span style="color:#fff;">[${d.platform}]</span>
                                            <span style="color:#a0a0a0;">${(d.query || '').substring(0, 50)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        ` : ''}
                    `;
                    loadDashboard();
                } else {
                    resultDiv.innerHTML = `<div style="color:#ef4444;">❌ ${data.error || data.message || '批量检测失败'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="color:#ef4444;">❌ 请求失败: ${error.message}</div>`;
            }
        }

        // 加载检测历史
        async function loadCitationBatches() {
            const resultDiv = document.getElementById('batchCheckResult');
            resultDiv.innerHTML = '<span style="color:#667eea;">⏳ 正在加载检测历史...</span>';
            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/batches?limit=20`);
                const data = await response.json();
                if (data.success) {
                    const batches = data.batches || data.result || [];
                    if (!batches.length) {
                        resultDiv.innerHTML = '<div style="color:#666;">暂无检测历史</div>';
                        return;
                    }
                    resultDiv.innerHTML = `
                        <table class="data-table" style="margin-top:8px;">
                            <thead>
                                <tr><th>批次名</th><th>平台</th><th>查询数</th><th>提及</th><th>引用率</th><th>状态</th><th>时间</th></tr>
                            </thead>
                            <tbody>
                                ${batches.map(b => {
                                    const total = b.total_queries || 0;
                                    const mentioned = b.mentioned_count || 0;
                                    const rate = total > 0 ? Math.round(mentioned / total * 100) : 0;
                                    return `
                                        <tr>
                                            <td style="font-size:0.85rem;">${b.batch_name || '-'}</td>
                                            <td style="font-size:0.85rem;">${b.platform || '-'}</td>
                                            <td>${total}</td>
                                            <td style="color:#10b981;">${mentioned}</td>
                                            <td style="color:#667eea;">${rate}%</td>
                                            <td>${b.status || '-'}</td>
                                            <td style="font-size:0.8rem;color:#a0a0a0;">${b.completed_at || b.started_at || b.created_at || '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color:#ef4444;">❌ ${data.error || '加载失败'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="color:#ef4444;">❌ 请求失败: ${error.message}</div>`;
            }
        }

        // 添加单个关键词
        async function addKeyword() {
            const keyword = document.getElementById('newKeywordInput').value.trim();
            const brandName = document.getElementById('brandNameInput').value.trim() || '织然家具';
            if (!keyword) {
                alert('请输入关键词');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/monitoring/citation-keywords`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, brand_name: brandName })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('newKeywordInput').value = '';
                    loadKeywords();
                } else {
                    alert(data.error || data.message || '添加失败');
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        // 批量添加关键词
        async function addBatchKeywords() {
            const text = document.getElementById('batchKeywordsInput').value.trim();
            if (!text) {
                alert('请输入关键词（每行一个）');
                return;
            }
            const keywords = text.split('\n').map(k => k.trim()).filter(Boolean);
            if (!keywords.length) {
                alert('请输入有效关键词');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/monitoring/citation-keywords`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: keywords })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('batchKeywordsInput').value = '';
                    loadKeywords();
                    alert(`成功添加 ${keywords.length} 个关键词`);
                } else {
                    alert(data.error || data.message || '添加失败');
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        // 加载关键词列表
        async function loadKeywords() {
            const listDiv = document.getElementById('keywordsList');
            try {
                const response = await fetch(`${API_BASE}/monitoring/citation-keywords`);
                const data = await response.json();
                if (data.success) {
                    const keywords = data.keywords || data.result || [];
                    if (!keywords.length) {
                        listDiv.innerHTML = '<span style="color:#666;">暂无关键词，请添加</span>';
                        return;
                    }
                    listDiv.innerHTML = keywords.map(k => `
                        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(102,126,234,0.2);border:1px solid rgba(102,126,234,0.4);border-radius:14px;font-size:0.85rem;">
                            ${k.keyword}
                            <a href="javascript:void(0)" onclick="deleteKeyword(${k.id})" style="color:#ef4444;text-decoration:none;font-weight:bold;">×</a>
                        </span>
                    `).join('');
                } else {
                    listDiv.innerHTML = `<span style="color:#ef4444;">${data.error || '加载失败'}</span>`;
                }
            } catch (error) {
                listDiv.innerHTML = `<span style="color:#ef4444;">请求失败: ${error.message}</span>`;
            }
        }

        // 删除关键词
        async function deleteKeyword(id) {
            if (!confirm('确定删除此关键词？')) return;
            try {
                const response = await fetch(`${API_BASE}/monitoring/citation-keywords/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    loadKeywords();
                } else {
                    alert(data.error || '删除失败');
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        // ============ 调度器状态 ============

        // 加载调度器状态
        async function loadSchedulerStatus() {
            const div = document.getElementById('schedulerStatus');
            if (!div) return;
            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/scheduler`);
                const data = await response.json();
                if (data.success) {
                    const s = data.scheduler || data.result || {};
                    const enabled = s.enabled !== false;
                    const nextRun = s.next_run_time || s.next_run || '未知';
                    const brand = s.brand_name || '织然家具';
                    const platforms = (s.platforms || []).join(', ') || 'chatgpt';
                    div.innerHTML = `
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${enabled ? '#10b981' : '#666'};"></span>
                            <span style="color:${enabled ? '#10b981' : '#a0a0a0'};">${enabled ? '已启用' : '已禁用'}</span>
                            <span style="color:#a0a0a0;">| 品牌: ${brand}</span>
                            <span style="color:#a0a0a0;">| 平台: ${platforms}</span>
                            <span style="color:#a0a0a0;">| 下次执行: ${nextRun}</span>
                            <span style="margin-left:auto;display:flex;gap:6px;">
                                <button class="btn-small" onclick="runSchedulerNow()">⚡ 立即执行</button>
                                <button class="btn-small" onclick="toggleScheduler(${enabled ? 'false' : 'true'})">${enabled ? '⏸ 禁用' : '▶ 启用'}</button>
                            </span>
                        </div>
                    `;
                } else {
                    div.innerHTML = `<span style="color:#ef4444;">加载调度器状态失败: ${data.error || ''}</span>`;
                }
            } catch (error) {
                div.innerHTML = `<span style="color:#ef4444;">请求失败: ${error.message}</span>`;
            }
        }

        // 立即执行调度器
        async function runSchedulerNow() {
            if (!confirm('立即执行批量检测？这可能需要几分钟。')) return;
            const div = document.getElementById('schedulerStatus');
            div.innerHTML = '<span style="color:#667eea;">⏳ 正在执行...</span>';
            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/scheduler/run-now`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await response.json();
                if (data.success) {
                    const r = data.result || {};
                    alert(`执行完成！\n总查询: ${r.total_queries || 0}\n提及: ${r.mentioned_count || 0}`);
                    loadSchedulerStatus();
                    loadDashboard();
                } else {
                    alert(data.error || data.message || '执行失败');
                    loadSchedulerStatus();
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
                loadSchedulerStatus();
            }
        }

        // 切换调度器启用状态
        async function toggleScheduler(enabled) {
            try {
                const response = await fetch(`${API_BASE}/monitoring/ai-citation/scheduler`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: enabled })
                });
                const data = await response.json();
                if (data.success) {
                    loadSchedulerStatus();
                } else {
                    alert(data.error || '更新失败');
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            }
        }

        // 页面加载完成后初始化批量检测面板
        document.addEventListener('DOMContentLoaded', function() {
            // 延迟加载，避免阻塞主面板
            setTimeout(() => {
                loadKeywords();
                loadSchedulerStatus();
            }, 500);

            // 回车添加关键词
            const kwInput = document.getElementById('newKeywordInput');
            if (kwInput) {
                kwInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addKeyword();
                });
            }
        });

        // 辅助函数
        function getPlatformIcon(platform) {
            const icons = {
                'doubao': '🟢',
                'deepseek': '🔵',
                'chatgpt': '🟣',
                'wenxinyiyan': '🔴',
                'tongyiqianwen': '🟠',
                'kimi': '🟡'
            };
            return icons[platform] || '🤖';
        }

        function getPlatformName(platform) {
            const names = {
                'doubao': '豆包',
                'deepseek': 'DeepSeek',
                'chatgpt': 'ChatGPT',
                'wenxinyiyan': '文心一言',
                'tongyiqianwen': '通义千问',
                'kimi': 'Kimi'
            };
            return names[platform] || platform;
        }

        function getSourceName(source) {
            const names = {
                'zhihu': '知乎',
                'xiaohongshu': '小红书',
                'weibo': '微博',
                'baidu': '百度搜索',
                'google': 'Google',
                'direct': '直接访问',
                'referral': '外部链接'
            };
            return names[source] || source;
        }
    </script>
</body>
</html>
