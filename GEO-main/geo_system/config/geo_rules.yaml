# GEO规则配置

# ERE框架配置 (Entity-Relation-Evidence)
ere_framework:
  entity:
    required: true
    min_count: 3
    types:
      - brand          # 品牌实体
      - product        # 产品实体
      - concept        # 概念实体
      - person         # 人物实体
      - organization   # 组织实体
  
  relation:
    required: true
    types:
      - is_a           # 是一种
      - part_of        # 是...的一部分
      - used_for       # 用于
      - related_to     # 相关于
      - created_by     # 由...创建
  
  evidence:
    required: true
    min_sources: 2
    types:
      - data           # 数据证据
      - case_study     # 案例研究
      - expert_quote   # 专家引言
      - research       # 研究引用

# 内容结构配置
content_structure:
  # 标题优化
  title:
    min_length: 15
    max_length: 60
    must_contain_question: false
    keyword_position: start  # start, middle, end
  
  # 段落结构
  paragraph:
    min_sentences: 3
    max_sentences: 8
    max_length: 150  # 中文字符数
  
  # 章节结构
  sections:
    min_count: 4
    max_count: 10
    required_sections:
      - introduction   # 引言
      - body           # 正文
      - conclusion     # 结论
      - sources        # 来源

# AI引用优化规则
citation_optimization:
  # 统计数据
  statistics:
    required: true
    min_per_article: 3
    citation_required: true
  
  # 专家引言
  expert_quotes:
    recommended: true
    min_per_article: 1
    attribution_required: true
  
  # 来源引用
  sources:
    min_count: 5
    diversity_required: true  # 来源多样性
    authority_preferred: true  # 优先权威来源

# 平台适配规则
platform_adaptation:
  chatgpt:
    content_depth: high      # 内容深度要求高
    citation_style: inline   # 行内引用
    preferred_length: 2000-4000
  
  perplexity:
    content_depth: medium
    citation_style: academic # 学术引用格式
    preferred_length: 1500-3000
  
  google_ai_overviews:
    content_depth: medium
    citation_style: snippet  # 片段引用
    preferred_length: 1000-2500
  
  gemini:
    content_depth: high
    citation_style: inline
    preferred_length: 2000-4000

# Schema.org配置
schema_org:
  required_types:
    - Article
    - Organization
    - Person
  
  recommended_properties:
    - author
    - datePublished
    - dateModified
    - headline
    - description
    - image
    - publisher

# 质量评分阈值
quality_thresholds:
  minimum_score: 70
  good_score: 85
  excellent_score: 95
  
  scoring_weights:
    structure: 25
    citations: 25
    readability: 20
    authority: 20
    uniqueness: 10
