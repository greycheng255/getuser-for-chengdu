version: '3.8'

services:
  geo-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geo-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=geo
      - DB_PASSWORD=mh6CYre2S8shJYrm
      - DB_NAME=geo
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  geo-frontend:
    image: nginx:alpine
    container_name: geo-frontend
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - geo-backend
    restart: unless-stopped
    networks:
      - geo-network

  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=geo
      - MYSQL_USER=geo
      - MYSQL_PASSWORD=mh6CYre2S8shJYrm
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - geo-network

networks:
  geo-network:
    driver: bridge

volumes:
  mysql_data:
